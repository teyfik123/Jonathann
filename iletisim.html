<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>İletişim - Jonathan Developer</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family: 'Poppins', sans-serif;

      /* ARKA PLAN RESMİ AYNI */

      background:
        linear-gradient(
          rgba(8, 8, 15, .48),
          rgba(8, 8, 15, .68)
        ),
        url('https://images.unsplash.com/photo-1580894894513-541e068a3e2b?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fDB8fHx8fA%3D%3D')
        no-repeat center center fixed;

      background-size: cover;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 2rem;

      color: #fff;

      overflow-x: hidden;

      position: relative;

    }


    /* ===============================
       RENK / IŞIK EFEKTİ
    =============================== */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255, 70, 90, .20),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(140, 40, 255, .14),
          transparent 35%
        );

      pointer-events: none;

      animation:
        backgroundGlow 8s ease-in-out infinite alternate;

    }


    @keyframes backgroundGlow {

      0% {
        opacity: .55;
      }

      100% {
        opacity: 1;
      }

    }


    /* ===============================
       ARKA PLAN HAREKETLİ IŞIKLAR
    =============================== */

    body::after {

      content: "";

      position: fixed;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      background:
        rgba(255, 60, 80, .12);

      filter: blur(100px);

      top: -120px;
      left: -100px;

      pointer-events: none;

      animation:
        floatingLight 9s ease-in-out infinite;

    }


    @keyframes floatingLight {

      0% {
        transform:
          translate(0, 0);
      }

      50% {
        transform:
          translate(100px, 70px);
      }

      100% {
        transform:
          translate(0, 0);
      }

    }


    /* ===============================
       ANA KART
    =============================== */

    .contact-container {

      position: relative;

      z-index: 2;

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.13),
          rgba(255,255,255,.045)
        );

      border-radius:
        28px;

      padding:
        3rem 4rem;

      box-shadow:

        0 30px 80px
        rgba(0,0,0,.55),

        inset 0 1px 0
        rgba(255,255,255,.18),

        0 0 45px
        rgba(255,70,90,.08);

      max-width:
        550px;

      width:
        100%;

      display:
        flex;

      flex-direction:
        column;

      gap:
        2.2rem;

      border:
        1px solid
        rgba(255,255,255,.20);

      overflow:
        hidden;

      animation:
        cardEnter .9s
        cubic-bezier(.2,.8,.2,1)
        both;

      transition:
        transform .4s ease,
        box-shadow .4s ease;

    }


    /* ÜST IŞIK ÇİZGİSİ */

    .contact-container::before {

      content: "";

      position: absolute;

      top: 0;

      left: 10%;

      width: 80%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #ff5e6c,
          transparent
        );

      box-shadow:
        0 0 15px #ff5e6c;

    }


    /* KART HOVER */

    .contact-container:hover {

      transform:
        translateY(-6px);

      box-shadow:

        0 40px 100px
        rgba(0,0,0,.65),

        0 0 55px
        rgba(255,60,80,.14),

        inset 0 1px 0
        rgba(255,255,255,.2);

    }


    @keyframes cardEnter {

      from {

        opacity: 0;

        transform:
          translateY(40px)
          scale(.96);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* ===============================
       BAŞLIK
    =============================== */

    h1 {

      font-weight:
        700;

      margin:
        0 0 .5rem 0;

      text-align:
        center;

      font-size:
        3.5rem;

      letter-spacing:
        -2px;

      background:
        linear-gradient(
          135deg,
          #ffffff 20%,
          #ff596c 70%,
          #ff8794
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      color:
        transparent;

      text-shadow:
        0 0 35px
        rgba(255,70,90,.15);

      animation:
        titleEnter 1s
        ease .2s both;

    }


    @keyframes titleEnter {

      from {

        opacity: 0;

        transform:
          translateY(-20px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* ===============================
       BİLGİLER
    =============================== */

    .contact-info {

      display:
        flex;

      flex-direction:
        column;

      gap:
        1rem;

      font-size:
        1rem;

      color:
        #f0f0f0;

    }


    .contact-item {

      display:
        flex;

      align-items:
        center;

      gap:
        1rem;

      padding:
        15px 17px;

      border-radius:
        15px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.08);

      transition:
        all .3s ease;

      animation:
        itemEnter .7s
        ease both;

    }


    .contact-item:nth-child(1) {
      animation-delay: .2s;
    }


    .contact-item:nth-child(2) {
      animation-delay: .3s;
    }


    .contact-item:nth-child(3) {
      animation-delay: .4s;
    }


    @keyframes itemEnter {

      from {

        opacity: 0;

        transform:
          translateX(-20px);

      }

      to {

        opacity: 1;

        transform:
          translateX(0);

      }

    }


    .contact-item:hover {

      transform:
        translateX(7px);

      background:
        rgba(255,70,90,.09);

      border-color:
        rgba(255,90,105,.25);

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.2);

    }


    /* ===============================
       İKONLAR
    =============================== */

    .contact-item i {

      font-size:
        1.15rem;

      color:
        #ff5e6c;

      width:
        43px;

      height:
        43px;

      min-width:
        43px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      border-radius:
        12px;

      background:
        rgba(255,60,80,.10);

      border:
        1px solid
        rgba(255,70,90,.16);

      box-shadow:
        0 0 20px
        rgba(255,60,80,.08);

      transition:
        .3s ease;

    }


    .contact-item:hover i {

      transform:
        scale(1.1)
        rotate(-5deg);

      background:
        rgba(255,60,80,.17);

      box-shadow:
        0 0 25px
        rgba(255,60,80,.18);

    }


    /* ===============================
       LİNKLER
    =============================== */

    .contact-item a {

      color:
        #ffffff;

      text-decoration:
        none;

      transition:
        color .3s ease;

      font-size:
        .95rem;

      overflow-wrap:
        anywhere;

    }


    .contact-item a:hover {

      color:
        #ff6978;

    }


    .contact-item span {

      font-size:
        .95rem;

    }


    /* ===============================
       SOSYAL MEDYA
    =============================== */

    .social-icons {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        12px;

      margin-top:
        .2rem;

    }


    .social-icons a {

      height:
        65px;

      border-radius:
        16px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      text-decoration:
        none;

      color:
        #fff;

      font-size:
        1.45rem;

      position:
        relative;

      overflow:
        hidden;

      border:
        1px solid
        rgba(255,255,255,.09);

      background:
        rgba(255,255,255,.055);

      transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;

    }


    .social-icons a::before {

      content: "";

      position:
        absolute;

      inset:
        0;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255,255,255,.18),
          transparent
        );

      transform:
        translateX(-120%);

      transition:
        transform .6s ease;

    }


    .social-icons a:hover::before {

      transform:
        translateX(120%);

    }


    .social-icons a:hover {

      transform:
        translateY(-7px)
        scale(1.03);

    }


    /* INSTAGRAM */

    .social-icons a.instagram {

      background:
        linear-gradient(
          135deg,
          rgba(253,89,73,.35),
          rgba(214,36,159,.35),
          rgba(40,90,235,.35)
        );

      box-shadow:
        0 8px 25px
        rgba(214,36,159,.12);

    }


    .social-icons a.instagram:hover {

      border-color:
        rgba(253,89,73,.45);

      box-shadow:
        0 15px 35px
        rgba(214,36,159,.30);

    }


    /* DISCORD */

    .social-icons a.discord {

      background:
        rgba(88,101,242,.25);

      box-shadow:
        0 8px 25px
        rgba(88,101,242,.12);

    }


    .social-icons a.discord:hover {

      border-color:
        rgba(88,101,242,.5);

      box-shadow:
        0 15px 35px
        rgba(88,101,242,.30);

    }


    /* GITHUB */

    .social-icons a.github {

      background:
        rgba(30,30,35,.65);

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);

    }


    .social-icons a.github:hover {

      border-color:
        rgba(255,255,255,.25);

      box-shadow:
        0 15px 35px
        rgba(0,0,0,.4);

    }


    /* ===============================
       PARLAMA ANİMASYONU
    =============================== */

    .social-icons a i {

      position:
        relative;

      z-index:
        2;

      transition:
        transform .3s ease;

    }


    .social-icons a:hover i {

      transform:
        scale(1.2)
        rotate(5deg);

    }


    /* ===============================
       MOBİL
    =============================== */

    @media (max-width: 600px) {

      body {

        padding:
          1rem;

      }


      .contact-container {

        padding:
          2rem 1.3rem;

        border-radius:
          22px;

        gap:
          1.8rem;

      }


      h1 {

        font-size:
          2.7rem;

      }


      .contact-item {

        padding:
          13px;

      }


      .contact-item a,
      .contact-item span {

        font-size:
          .85rem;

      }


      .social-icons {

        gap:
          9px;

      }


      .social-icons a {

        height:
          57px;

        font-size:
          1.2rem;

      }

    }


    /* ===============================
       ÇOK KÜÇÜK EKRAN
    =============================== */

    @media (max-width: 400px) {

      h1 {

        font-size:
          2.35rem;

      }


      .contact-container {

        padding:
          1.7rem 1rem;

      }

    }

  </style>

</head>


<body>


  <div class="contact-container">


    <h1>
      İletişim

    <div class="contact-info">

    </div>


  </div>


</body>
